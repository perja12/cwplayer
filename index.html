<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12161d" />
    <meta name="description" content="A focused Morse code listening and practice player." />
    <script>
      // Apply the saved theme before the first paint. Keep the key in sync with
      // KEYS.theme in src/model/defaults.ts.
      (() => {
        let theme = null;
        try {
          const stored = JSON.parse(localStorage.getItem("cw-player-v2-theme") ?? "null");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {
          // Fall back to the system preference.
        }
        document.documentElement.dataset.theme =
          theme ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();
    </script>
    <style>
      /* Critical boot styles so the first paint is branded instead of blank. */
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      html {
        color-scheme: dark;
        background: #12161d;
        color: #e9edf5;
      }
      html[data-theme="light"] {
        color-scheme: light;
        background: #f4f5f8;
        color: #202b3c;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .boot-splash {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .boot-brand {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .boot-bar {
        position: relative;
        display: block;
        width: 88px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #39465b;
      }
      html[data-theme="light"] .boot-bar {
        background: #d9e2ee;
      }
      .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        border-radius: inherit;
        background: #a4c7ff;
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      html[data-theme="light"] .boot-bar::after {
        background: #285ea6;
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          width: 100%;
          opacity: 0.5;
          animation: none;
        }
      }
    </style>
    <link
      rel="preload"
      href="/src/assets/fonts/literata-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CW Player</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-label="Loading CW Player">
        <span class="boot-brand">CW Player</span>
        <span class="boot-bar" aria-hidden="true"></span>
      </div>
    </div>
    <div id="toast" role="status" class="toast" hidden></div>
    <script src="/vendor/streamsaver/StreamSaver.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
